version: '3.8'
services:
  # Mini Relational DBMS Service
  mini-dbms:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - '8080:8080'
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped

  # MySQL database (for development/testing)
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: dbflow
    ports:
      - '3306:3306'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/mysql

  # Database admin interface
  adminer:
    image: adminer:latest
    restart: always
    ports:
      - '8081:8080'

volumes:
  db-data:
