apiVersion: apps/v1
kind: Deployment
metadata:
  name: minidb
  labels:
    app: minidb
spec:
  replicas: 3
  selector:
    matchLabels:
      app: minidb
  template:
    metadata:
      labels:
        app: minidb
    spec:
      containers:
      - name: minidb
        image: minidb:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: minidb-config
              key: port
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
