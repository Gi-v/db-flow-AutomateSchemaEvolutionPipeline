apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-dbms
  labels:
    app: mini-dbms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mini-dbms
  template:
    metadata:
      labels:
        app: mini-dbms
    spec:
      containers:
      - name: mini-dbms
        image: mini-dbms:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
