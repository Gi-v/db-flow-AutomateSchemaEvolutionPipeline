apiVersion: v1
kind: Service
metadata:
  name: minidb
  labels:
    app: minidb
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: minidb
---
apiVersion: v1
kind: Service
metadata:
  name: minidb-nodeport
  labels:
    app: minidb
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
    name: http
  selector:
    app: minidb
