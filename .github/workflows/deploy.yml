name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "Building Docker image..."
          make docker-build
          # Uncomment when registry is configured
          # docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD $DOCKER_REGISTRY
          # docker tag minidb:latest $DOCKER_REGISTRY/minidb:latest
          # docker push $DOCKER_REGISTRY/minidb:latest

      - name: Deploy to Kubernetes
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          echo "Deploying to Kubernetes..."
          # Uncomment when k8s cluster is configured
          # echo "$KUBECONFIG_DATA" | base64 -d > kubeconfig.yaml
          # export KUBECONFIG=kubeconfig.yaml
          # kubectl apply -f deploy/k8s/
          # kubectl rollout status deployment/minidb
          echo "Deployment configured. Set up secrets to enable."

  helm-deploy:
    name: Deploy using Helm
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [deploy]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Helm deploy
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          echo "Deploying with Helm..."
          # Uncomment when k8s cluster is configured
          # echo "$KUBECONFIG_DATA" | base64 -d > kubeconfig.yaml
          # export KUBECONFIG=kubeconfig.yaml
          # helm upgrade --install minidb deploy/helm/minidb --wait
          echo "Helm deployment configured. Set up secrets to enable."
