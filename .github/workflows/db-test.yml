name: Database Migration Test
on: [push, pull_request]

jobs :
    test-migrations:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:13
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: password
                    POSTGRES_DB: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U postgres"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        steps:
            - uses: actions/checkout@v3
            - name: Install Flyway
              run: |
                wget -qO- https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/10.0.0/flyway-commandline-10.0.0-linux-x64.tar.gz | tar -xz
                sudo ln -s $(pwd)/flyway-10.0.0/flyway /usr/local/bin/flyway
            
            - name: Run Snyk to check for vulnerabilities
              uses: snyk/actions/iac@master
              env:
                SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              with:
                file: sql/

            - name: Run Flyway Migrations
              run: |
                flyway -url=jdbc:postgresql://localhost:5432/postgres -user=postgres -password=password -locations=filesystem:sql migrate